# ============================================================
# Konfigurasi Nginx FINAL (HTTP -> HTTPS redirect + SSL).
# GANTI semua "example.com" dengan domain Anda.
# ============================================================

# --- Blok 1: port 80 (HTTP) ---
# Tugasnya hanya dua: (a) melayani verifikasi Let's Encrypt,
# (b) mengalihkan semua pengunjung ke HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name telur.wijayaplywoods.com;

    # Folder tempat certbot menaruh file "bukti kepemilikan domain"
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Blok 2: port 443 (HTTPS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # Sertifikat dari Let's Encrypt (dibuat oleh certbot)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Hanya TLS modern; versi lama (SSLv3, TLS 1.0/1.1) tidak aman.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Header keamanan dasar
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Laravel selalu memakai folder /public sebagai pintu masuk
    root /var/www/html/public;
    index index.php;

    # Batas ukuran upload (harus >= post_max_size di PHP)
    client_max_body_size 20M;

    # Semua request: coba cari file aslinya dulu; kalau tidak ada,
    # serahkan ke Laravel (index.php) untuk diproses routing-nya.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Request .php diteruskan ke container "app" (PHP-FPM) di port 9000
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Blokir akses ke file tersembunyi (.env, .git, dll), kecuali .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache file statis di browser
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}