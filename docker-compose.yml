# Letakkan di ROOT project (sejajar dengan artisan & composer.json).
# Compose otomatis membaca .env di folder yang sama untuk variabel ${...}.

services:
  # --- Resepsionis: HTTP internal via proxy-net ---
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: "service:erp-app"
    container_name: erp-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - default
      - proxy-net
    depends_on:
      - erp-app

  # --- Koki: Laravel (kode sudah ada di dalam image) ---
  erp-app:
    image: ghcr.io/wijaya-plywood-indonesia/erp-telur:latest
    container_name: erp-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage
    networks:
      - default
      - proxy-net
    depends_on:
      db:
        condition: service_healthy

  # --- Gudang: MySQL (tidak dibuka ke internet) ---
  db:
    image: mysql:8.0
    container_name: erp-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Alat bantu SSL: tidak jalan otomatis, hanya dipanggil manual ---
  certbot:
    image: certbot/dns-cloudflare
    profiles: [ "tools" ]
    entrypoint: certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - ./docker/certbot/cloudflare.ini:/cloudflare.ini:ro

volumes:
  db-data:
  app-storage:
  certbot-conf:

networks:
  proxy-net:
    external: true
