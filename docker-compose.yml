# Letakkan file ini di ROOT project (sejajar dengan artisan & composer.json).
# Compose otomatis membaca file .env di folder yang sama untuk variabel ${...}.

services:
  # --- Resepsionis: menerima request dari internet ---
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: "service:app"     # build service "app" dulu, lalu ambil public/-nya
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Tahap 1 pakai default.http.conf, tahap 2 (default) pakai default.conf.
      - ./docker/nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - app
    # Reload Nginx tiap 6 jam supaya sertifikat hasil perpanjangan terbaca.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]

  # --- Koki: menjalankan kode Laravel (kode sudah ada di dalam image) ---
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: erp-app:latest
    container_name: erp-app
    restart: unless-stopped
    env_file: .env             # .env disuntikkan saat runtime, tidak masuk image
    environment:
      TZ: Asia/Jakarta
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  # --- Gudang: database MySQL (tidak dibuka ke internet) ---
  db:
    image: mysql:8.0
    container_name: erp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Petugas perizinan: sertifikat SSL gratis + perpanjangan otomatis ---
  certbot:
    image: certbot/certbot
    container_name: erp-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"]

volumes:
  db-data:
  app-storage:
  certbot-conf:
  certbot-www: